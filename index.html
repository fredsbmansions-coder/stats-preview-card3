<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stats Preview Card</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="card">

        <div class="content">

            <h1>
                Get <span>insights</span> that help your business grow.
            </h1>

            <p class="description">
                Discover the benefits of data analytics and make
                better decisions regarding revenue, customer
                experience, and overall efficiency.
            </p>

            <div class="stats">

                <div class="stat">
                    <h2>10k+</h2>
                    <p>Companies</p>
                </div>

                <div class="stat">
                    <h2>314</h2>
                    <p>Templates</p>
                </div>

                <div class="stat">
                    <h2>12M+</h2>
                    <p>Queries</p>
                </div>

            </div>

        </div>

        <div class="photo">
            <img src="image-header-desktop.jpg" alt="People working together">
        </div>

    </main>

</body>

</html>
